<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ad Creative Portfolio | ショート動画広告クリエイティブ集</title>
  <meta name="description" content="Remotionで制作したショート動画広告のポートフォリオ。31本の日本語ショート広告クリエイティブを掲載。">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --card-bg: #141414;
      --card-hover: #1a1a1a;
      --text: #f5f5f5;
      --text-secondary: #a0a0a0;
      --accent: #FF6B35;
      --accent-glow: rgba(255, 107, 53, 0.3);
      --border: #222;
    }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 80px 24px 60px;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 50%, #0a0a0a 100%);
      border-bottom: 1px solid var(--border);
    }
    .hero h1 {
      font-size: 2.5rem;
      font-weight: 900;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #FF6B35, #FFD700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero p {
      color: var(--text-secondary);
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto 24px;
    }
    .hero .stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 32px;
    }
    .hero .stat-item {
      text-align: center;
    }
    .hero .stat-value {
      font-size: 2rem;
      font-weight: 900;
      color: var(--accent);
    }
    .hero .stat-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    /* Filter */
    .filter-bar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 24px;
      position: sticky;
      top: 0;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(12px);
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }
    .filter-btn {
      padding: 8px 20px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
      padding: 32px 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Card */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: all 0.3s;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 8px 32px var(--accent-glow);
    }
    .card .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 177.78%; /* 9:16 aspect ratio */
      background: #000;
    }
    .card .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .card .video-container .placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
    .card .video-container .placeholder .play-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }
    .card .info {
      padding: 16px 20px;
    }
    .card .info h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .card .info .genre {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 12px;
      background: rgba(255, 107, 53, 0.15);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-content {
      position: relative;
      width: 90%;
      max-width: 400px;
      max-height: 90vh;
    }
    .modal-content .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 177.78%;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
    }
    .modal-content .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .modal-close {
      position: absolute;
      top: -40px;
      right: 0;
      background: none;
      border: none;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 40px 24px;
      border-top: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.85rem;
    }
    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    /* Tech badge */
    .tech-badges {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
    }
    .tech-badge {
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
      font-size: 0.8rem;
      border: 1px solid var(--border);
    }

    @media (max-width: 640px) {
      .hero h1 { font-size: 1.8rem; }
      .hero .stats { gap: 20px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; padding: 16px; }
    }
  </style>
</head>
<body>

<section class="hero">
  <h1>Ad Creative Portfolio</h1>
  <p>Remotion (React) でプログラマティックに生成した<br>ショート動画広告クリエイティブ集</p>
  <div class="stats">
    <div class="stat-item">
      <div class="stat-value">31</div>
      <div class="stat-label">動画本数</div>
    </div>
    <div class="stat-item">
      <div class="stat-value">30s</div>
      <div class="stat-label">各動画尺</div>
    </div>
    <div class="stat-item">
      <div class="stat-value">1080x1920</div>
      <div class="stat-label">解像度</div>
    </div>
  </div>
  <div class="tech-badges">
    <span class="tech-badge">React</span>
    <span class="tech-badge">Remotion</span>
    <span class="tech-badge">TypeScript</span>
    <span class="tech-badge">Data-Driven</span>
  </div>
</section>

<div class="filter-bar">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="health">健康</button>
  <button class="filter-btn" data-filter="beauty">美容</button>
  <button class="filter-btn" data-filter="skincare">スキンケア</button>
  <button class="filter-btn" data-filter="haircare">ヘアケア</button>
  <button class="filter-btn" data-filter="fitness">フィットネス</button>
  <button class="filter-btn" data-filter="diet">ダイエット</button>
  <button class="filter-btn" data-filter="oral">オーラルケア</button>
  <button class="filter-btn" data-filter="gadget">ガジェット</button>
  <button class="filter-btn" data-filter="relaxation">リラクゼーション</button>
</div>

<div class="grid" id="videoGrid"></div>

<div class="modal-overlay" id="modal">
  <div class="modal-content">
    <button class="modal-close" id="modalClose">&times;</button>
    <div class="video-wrapper" id="modalVideo"></div>
  </div>
</div>

<footer>
  <p>Built with Remotion + React + TypeScript</p>
  <p style="margin-top:8px">1つのVideoConfig配列から31本を自動生成するデータ駆動型アーキテクチャ</p>
</footer>

<script>
const VIDEOS = [
  { id: "Video01-DietSupplement", title: "ダイエットサプリ", genre: "health", youtubeId: "" },
  { id: "Video02-Skincare", title: "美白美容液", genre: "beauty", youtubeId: "" },
  { id: "Video03-HairGrowth", title: "育毛剤", genre: "haircare", youtubeId: "" },
  { id: "Video04-ProteinBar", title: "プロテインバー", genre: "fitness", youtubeId: "" },
  { id: "Video05-SleepPill", title: "睡眠サプリ", genre: "health", youtubeId: "" },
  { id: "Video06-EyeCream", title: "目元クリーム", genre: "beauty", youtubeId: "" },
  { id: "Video07-ToothWhitening", title: "ホワイトニング歯磨き", genre: "oral", youtubeId: "" },
  { id: "Video08-CollagenDrink", title: "コラーゲンドリンク", genre: "beauty", youtubeId: "" },
  { id: "Video09-FatBurner", title: "脂肪燃焼ジェル", genre: "diet", youtubeId: "" },
  { id: "Video10-VitaminC", title: "ビタミンCサプリ", genre: "health", youtubeId: "" },
  { id: "Video11-DeoSpray", title: "制汗デオドラント", genre: "health", youtubeId: "" },
  { id: "Video12-NailSerum", title: "ネイルセラム", genre: "beauty", youtubeId: "" },
  { id: "Video13-KneeSupport", title: "膝サポーター", genre: "gadget", youtubeId: "" },
  { id: "Video14-EyeSupplement", title: "ブルーライトサプリ", genre: "health", youtubeId: "" },
  { id: "Video15-WrinkleCream", title: "シワ改善クリーム", genre: "skincare", youtubeId: "" },
  { id: "Video16-GutHealth", title: "腸活サプリ", genre: "health", youtubeId: "" },
  { id: "Video17-FootMassager", title: "フットマッサージャー", genre: "relaxation", youtubeId: "" },
  { id: "Video18-HairOil", title: "ヘアオイル", genre: "haircare", youtubeId: "" },
  { id: "Video19-BodyScrub", title: "ボディスクラブ", genre: "beauty", youtubeId: "" },
  { id: "Video20-AcnePatch", title: "ニキビパッチ", genre: "skincare", youtubeId: "" },
  { id: "Video21-PostureCorrector", title: "姿勢矯正ベルト", genre: "gadget", youtubeId: "" },
  { id: "Video22-LipPlumper", title: "リッププランパー", genre: "beauty", youtubeId: "" },
  { id: "Video23-MCTOil", title: "MCTオイル", genre: "diet", youtubeId: "" },
  { id: "Video24-HandCream", title: "ハンドクリーム", genre: "skincare", youtubeId: "" },
  { id: "Video25-BlueLightGlass", title: "ブルーライトメガネ", genre: "gadget", youtubeId: "" },
  { id: "Video26-ScalpShampoo", title: "スカルプシャンプー", genre: "haircare", youtubeId: "" },
  { id: "Video27-ElectricBrush", title: "電動歯ブラシ", genre: "oral", youtubeId: "" },
  { id: "Video28-MusclePatch", title: "筋肉リカバリーパッチ", genre: "fitness", youtubeId: "" },
  { id: "Video29-SunscreenGel", title: "日焼け止めジェル", genre: "skincare", youtubeId: "" },
  { id: "Video30-IronSupplement", title: "鉄分サプリ", genre: "health", youtubeId: "" },
  { id: "Video31-DetoxTea", title: "デトックスティー", genre: "diet", youtubeId: "" },
];

const GENRE_LABELS = {
  health: "健康", beauty: "美容", skincare: "スキンケア", haircare: "ヘアケア",
  fitness: "フィットネス", diet: "ダイエット", oral: "オーラルケア",
  gadget: "ガジェット", relaxation: "リラクゼーション",
};

const grid = document.getElementById("videoGrid");
const modal = document.getElementById("modal");
const modalVideo = document.getElementById("modalVideo");
const modalClose = document.getElementById("modalClose");

function renderGrid(filter) {
  const filtered = filter === "all" ? VIDEOS : VIDEOS.filter(v => v.genre === filter);
  grid.innerHTML = filtered.map(v => {
    const hasVideo = v.youtubeId && v.youtubeId.length > 0;
    const videoContent = hasVideo
      ? `<iframe src="https://www.youtube.com/embed/${v.youtubeId}?loop=1&playlist=${v.youtubeId}" allow="autoplay; encrypted-media" allowfullscreen loading="lazy"></iframe>`
      : `<div class="placeholder"><span class="play-icon">🎬</span>${v.id}</div>`;

    return `
      <div class="card" data-genre="${v.genre}" data-youtube="${v.youtubeId || ""}" data-id="${v.id}">
        <div class="video-container">${videoContent}</div>
        <div class="info">
          <h3>${v.title}</h3>
          <span class="genre">${GENRE_LABELS[v.genre] || v.genre}</span>
        </div>
      </div>`;
  }).join("");
}

// Filter buttons
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderGrid(btn.dataset.filter);
  });
});

// Modal
grid.addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  if (!card) return;
  const ytId = card.dataset.youtube;
  if (!ytId) return;
  modalVideo.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&loop=1&playlist=${ytId}" allow="autoplay; encrypted-media" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;border-radius:16px"></iframe>`;
  modal.classList.add("active");
});

modalClose.addEventListener("click", () => {
  modal.classList.remove("active");
  modalVideo.innerHTML = "";
});

modal.addEventListener("click", (e) => {
  if (e.target === modal) {
    modal.classList.remove("active");
    modalVideo.innerHTML = "";
  }
});

// Initial render
renderGrid("all");
</script>

</body>
</html>
